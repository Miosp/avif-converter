[project]
name = "avifconverter"
version = "0.1.0"
description = "Convert images to AVIF with color signaling (CICP + ICC) that survives real-world viewers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "click>=8.3.3",
    "Pillow>=12.2.0",
    "numba>=0.65.1",
    "pyexiftool>=0.5.6",
    "pyvips>=3.1.1",
    "tqdm>=4.67.3",
]
